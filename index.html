<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in - Chloe&#8217;s Car Rental</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{color-scheme:light;--bg:#F6F4EF;--surface:#fff;--ink:#14213D;--muted:#6B7280;--line:#E3E0D8;--gold:#F5B232;--accent:#2F6FE4;--err:#D93A3A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:14px}
.mk{width:72px;height:72px;flex:none}
.nm{font:600 1.7rem/1.1 "Newsreader",Georgia,serif;letter-spacing:.3em;padding-bottom:5px;border-bottom:3px solid var(--gold)}
.sb{font-weight:600;font-size:.8rem;letter-spacing:.5em;margin-top:8px}
form{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(20,33,61,.05),0 14px 34px -18px rgba(20,33,61,.18)}
h1{margin:0;font:600 1.4rem/1.2 "Newsreader",Georgia,serif}
p.lead{margin:-8px 0 0;color:var(--muted);font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:.78rem;font-weight:600;color:var(--muted)}
input{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,228,.2)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;transition:filter .15s}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{min-height:1.4em;margin:0;font-size:.88rem;color:var(--muted)}
.msg.err{color:var(--err)}
small{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
  <div class="brand"><svg class="mk" viewBox="0 0 64 64" role="img" aria-label="Chloe's Car Rental logo"><circle cx="32" cy="32" r="32" fill="#14213D"/><circle cx="32" cy="32" r="31" fill="none" stroke="rgba(255,255,255,.12)"/><path d="M47.5 17.5A20.5 20.5 0 1 0 47.5 46.5" fill="none" stroke="#F5B232" stroke-width="4.6" stroke-linecap="round"/></svg><div><div class="nm">CHLOE&#8217;S</div><div class="sb">CAR RENTAL</div></div></div>
  <form id="f" autocomplete="on">
    <h1>Sign in</h1>
    <p class="lead">Enter your email and password to open the financial report.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="msg" id="msg" role="status"></p>
    <button id="go" type="submit">Sign in</button>
  </form>
  <small>Only authorized users can view this report.</small>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var cfg = window.APP_CONFIG || {}, url = cfg.SUPABASE_URL || "", key = cfg.SUPABASE_KEY || "";
  var msg = document.getElementById("msg"), form = document.getElementById("f"), btn = document.getElementById("go");
  if (url.indexOf("http") !== 0 || key.length < 20 || !window.supabase) {
    msg.textContent = "Setup needed: add your Supabase URL and key to config.js.";
    msg.className = "msg err"; btn.disabled = true; return;
  }
  var sb = window.supabase.createClient(url, key);
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) location.replace("dashboard.html"); });
  form.addEventListener("submit", function (e) {
    e.preventDefault(); btn.disabled = true; msg.className = "msg"; msg.textContent = "Signing in…";
    sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value })
      .then(function (r) {
        if (r.error || !r.data.session) { msg.className = "msg err"; msg.textContent = "Wrong email or password. Try again."; btn.disabled = false; return; }
        location.replace("dashboard.html");
      })
      .catch(function () { msg.className = "msg err"; msg.textContent = "Could not connect. Check your internet and try again."; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
